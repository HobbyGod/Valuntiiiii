<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070513" />
  <title>Valentine Particles</title>

  <!-- Fancy script + premium serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#05040a;
      --bg1:#070513;
      --bg2:#120524;

      --glass: rgba(255,255,255,0.055);
      --glass2: rgba(255,255,255,0.085);

      --txt: rgba(255,255,255,0.93);
      --muted: rgba(255,255,255,0.74);

      --pink: 255, 85, 165;
      --violet: 160, 105, 255;
      --cyan: 105, 230, 255;
      --gold: 255, 215, 165;

      --serif: "Cormorant Garamond", ui-serif, "Didot", "Baskerville", "Times New Roman", serif;
      --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", "Zapfino", cursive;
      --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    html, body {
      margin:0; height:100%;
      overflow:hidden;
      background:
        radial-gradient(1200px 820px at 18% 15%, rgba(var(--violet),0.22), transparent 58%),
        radial-gradient(1200px 820px at 92% 18%, rgba(var(--pink),0.18), transparent 58%),
        radial-gradient(900px 720px at 60% 96%, rgba(var(--cyan),0.10), transparent 62%),
        linear-gradient(180deg, var(--bg1), var(--bg0) 62%, #04030a);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* subtle grain = premium feel */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        linear-gradient(0deg, rgba(255,255,255,0.018), rgba(255,255,255,0.010)),
        repeating-linear-gradient(90deg,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 1px,
          rgba(0,0,0,0) 2px,
          rgba(0,0,0,0) 5px
        );
      opacity:0.16;
      mix-blend-mode: overlay;
      pointer-events:none;
    }

    canvas{
      position:fixed; inset:0;
      width:100%; height:100%;
      display:block;
      touch-action: none;
    }

    .overlay{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      padding: 26px;
      pointer-events:none;
    }

    .card{
      position:relative;
      width:min(720px, 92vw);
      border-radius: 26px;
      padding: 26px 22px 20px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        0 40px 160px rgba(0,0,0,0.62),
        0 14px 54px rgba(0,0,0,0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow:hidden;
      transform: translateZ(0);
      animation: floaty 6.2s ease-in-out infinite;
    }

    /* luxury rim glow */
    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius: 28px;
      background: linear-gradient(135deg,
        rgba(var(--gold),0.55),
        rgba(var(--pink),0.50),
        rgba(var(--violet),0.45),
        rgba(var(--cyan),0.28)
      );
      opacity:0.34;
      filter: blur(18px);
      pointer-events:none;
    }

    /* inner highlights */
    .card::after{
      content:"";
      position:absolute; inset:0;
      border-radius: 26px;
      background:
        radial-gradient(900px 260px at 18% 0%, rgba(255,255,255,0.11), transparent 55%),
        radial-gradient(540px 220px at 92% 8%, rgba(255,255,255,0.07), transparent 62%);
      pointer-events:none;
    }

    /* light sweep */
    .sweep{
      position:absolute;
      inset:-40% -60%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,0.03) 35%,
        rgba(var(--gold),0.08) 50%,
        rgba(255,255,255,0.03) 65%,
        transparent 100%
      );
      transform: rotate(18deg) translateX(-40%);
      animation: sweep 7.8s ease-in-out infinite;
      pointer-events:none;
      z-index:1;
      mix-blend-mode: screen;
    }

    @keyframes sweep{
      0%, 58% { transform: rotate(18deg) translateX(-40%); opacity:0.0; }
      70%     { opacity:0.85; }
      100%    { transform: rotate(18deg) translateX(40%);  opacity:0.0; }
    }

    @keyframes floaty{
      0%,100%{ transform: translateY(0px); }
      50%{ transform: translateY(-6px); }
    }

    .kicker{
      position:relative; z-index:2;
      text-align:center;
      font-family: var(--serif);
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-size: 12px;
      color: rgba(255,255,255,0.74);
      margin-bottom: 8px;
    }

    .scriptline{
      position:relative; z-index:2;
      text-align:center;
      font-family: var(--script);
      font-size: clamp(34px, 7.2vw, 62px);
      line-height: 1.02;
      color: rgba(255,255,255,0.98);
      margin: 8px 0 6px;
      text-shadow:
        0 0 18px rgba(var(--gold),0.18),
        0 0 30px rgba(var(--pink),0.28),
        0 26px 120px rgba(var(--pink),0.14);
    }

    h1{
      position:relative; z-index:2;
      margin: 0;
      text-align:center;
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(30px, 6.2vw, 58px);
      line-height: 1.06;
      letter-spacing: 0.02em;

      /* premium gradient text */
      background: linear-gradient(90deg,
        rgba(var(--gold),0.96),
        rgba(255,255,255,0.98),
        rgba(var(--pink),0.92)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 22px rgba(var(--pink),0.20),
        0 18px 90px rgba(var(--pink),0.14);
    }

    .orn{
      position:relative; z-index:2;
      margin: 12px auto 12px;
      width: min(560px, 88%);
      height: 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      opacity:0.92;
      color: rgba(255,255,255,0.62);
      font-family: var(--serif);
      letter-spacing: 0.12em;
      font-size: 12px;
    }
    .orn::before,
    .orn::after{
      content:"";
      height:1px;
      flex:1;
      background: linear-gradient(90deg,
        transparent,
        rgba(255,255,255,0.16),
        rgba(var(--gold),0.26),
        rgba(255,255,255,0.16),
        transparent
      );
    }

    .sub{
      position:relative; z-index:2;
      text-align:center;
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(16px, 3.8vw, 22px);
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.88);
      margin: 2px 0 12px;
      text-shadow: 0 14px 60px rgba(0,0,0,0.32);
    }

    .msg{
      position:relative; z-index:2;
      text-align:center;
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(15px, 3.2vw, 19px);
      line-height: 1.70;
      color: rgba(255,255,255,0.80);
      text-shadow: 0 12px 50px rgba(0,0,0,0.34);
    }

    .cta{
      position:relative; z-index:2;
      margin-top: 14px;
      display:flex;
      justify-content:center;
    }

    .cta span{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.26);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.76);
      font-size: 12px;
      letter-spacing: 0.26px;
      box-shadow: 0 14px 56px rgba(0,0,0,0.35);
      font-family: var(--ui);
    }

    .cta .dot{
      width:7px; height:7px; border-radius:999px;
      background: rgba(var(--cyan),0.85);
      box-shadow: 0 0 18px rgba(var(--cyan),0.48);
    }

    @media (prefers-reduced-motion: reduce){
      .card{ animation:none; }
      .sweep{ animation:none; }
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>

  <div class="overlay">
    <div class="card">
      <div class="sweep"></div>

      <div class="kicker">FOR NOUR</div>
      <div class="scriptline">My dearest Nour</div>
      <h1>Happy Valentine’s Day 💗</h1>

      <div class="orn">✦</div>

      <div class="sub">Time passes, but our story continues.</div>

      <p class="msg">
        For you — my favorite person.<br/>
        Tap anywhere and make the hearts bloom.
      </p>

      <div class="cta">
        <span><span class="dot"></span> Tap: heart burst · Swipe: heart trail</span>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
  function resize() {
    W = Math.floor(innerWidth);
    H = Math.floor(innerHeight);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize, { passive: true });
  resize();

  const rand = (a,b)=> a + Math.random()*(b-a);
  const clamp = (x,a,b)=> Math.max(a, Math.min(b,x));

  function drawHeartPath(ctx) {
    ctx.beginPath();
    const s = 1/18;
    for (let i=0; i<=120; i++) {
      const t = (i/120) * Math.PI * 2;
      const x = 16*Math.pow(Math.sin(t),3);
      const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      const px = x * s;
      const py = -y * s;
      if (i===0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  const bokeh = Array.from({length: 30}, () => ({
    x: rand(0, W),
    y: rand(0, H),
    r: rand(40, 160),
    a: rand(0.03, 0.10),
    vx: rand(-0.08, 0.08),
    vy: rand(-0.05, 0.05),
    hue: rand(330, 20)
  }));

  const particles = [];
  const floatHearts = [];

  function spawnBurst(x,y, n=42) {
    for (let i=0; i<n; i++) {
      const ang = rand(0, Math.PI*2);
      const spd = rand(0.6, 3.4);
      const vx = Math.cos(ang) * spd;
      const vy = Math.sin(ang) * spd - rand(0.6, 2.2);
      particles.push(new Particle(x, y, vx, vy, rand(10, 28), rand(0.9, 1.7), rand(330, 20)));
    }
    for (let i=0; i<14; i++) {
      const ang = rand(0, Math.PI*2);
      const spd = rand(0.8, 4.2);
      particles.push(new Spark(x, y, Math.cos(ang)*spd, Math.sin(ang)*spd, rand(0.8, 1.4)));
    }
  }

  function spawnTrail(x,y) {
    if (Math.random() < 0.55) {
      particles.push(new Particle(x, y, rand(-0.6,0.6), rand(-1.8,-0.2), rand(8, 18), rand(0.7, 1.3), rand(330, 20), 0.85));
    }
  }

  class Particle {
    constructor(x,y,vx,vy,size,life,hue,alpha=1) {
      this.x=x; this.y=y;
      this.vx=vx; this.vy=vy;
      this.size=size;
      this.life=life;
      this.age=0;
      this.rot=rand(-Math.PI, Math.PI);
      this.vr=rand(-0.06, 0.06);
      this.hue=hue;
      this.alpha=alpha;
      this.drag=0.985;
      this.g=0.045;
    }
    step(dt) {
      this.age += dt;
      this.vx *= this.drag;
      this.vy = this.vy * this.drag + this.g;
      this.x += this.vx * dt*60;
      this.y += this.vy * dt*60;
      this.rot += this.vr * dt*60;
      return this.age < this.life;
    }
    draw(ctx) {
      const t = this.age / this.life;
      const fade = (1 - t);
      const a = this.alpha * fade * 0.95;
      if (a <= 0.001) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      const s = this.size * (0.55 + 0.55*fade);
      ctx.scale(s, s);

      ctx.shadowBlur = 24 * (0.4 + fade);
      ctx.shadowColor = `hsla(${this.hue}, 95%, 62%, ${0.35*a})`;

      const grad = ctx.createRadialGradient(0, -0.2, 0.05, 0, 0, 1.2);
      grad.addColorStop(0, `hsla(${this.hue}, 95%, 75%, ${0.95*a})`);
      grad.addColorStop(1, `hsla(${this.hue}, 95%, 55%, ${0.18*a})`);
      ctx.fillStyle = grad;

      drawHeartPath(ctx);
      ctx.fill();

      ctx.lineWidth = 0.06;
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 88%, ${0.22*a})`;
      ctx.stroke();

      ctx.restore();
    }
  }

  class Spark {
    constructor(x,y,vx,vy,life) {
      this.x=x; this.y=y; this.vx=vx; this.vy=vy;
      this.life=life; this.age=0;
    }
    step(dt) {
      this.age += dt;
      this.vx *= 0.985;
      this.vy = this.vy * 0.985 + 0.055;
      this.x += this.vx * dt*60;
      this.y += this.vy * dt*60;
      return this.age < this.life;
    }
    draw(ctx) {
      const t = this.age / this.life;
      const a = (1-t) * 0.8;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = `rgba(255,255,255,${0.9})`;
      ctx.shadowBlur = 18;
      ctx.shadowColor = `rgba(255,120,180,${0.55})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 1.4 + (1-t)*1.2, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function spawnFloatHeart() {
    floatHearts.push({
      x: rand(0, W),
      y: H + rand(20, 120),
      vy: rand(-0.25, -0.65),
      vx: rand(-0.12, 0.12),
      size: rand(10, 22),
      rot: rand(-0.8, 0.8),
      vr: rand(-0.01, 0.01),
      hue: rand(330, 20),
      a: rand(0.08, 0.18)
    });
  }

  let last = performance.now();
  let pointer = { x: W*0.5, y: H*0.55, moved:false };
  let trailCooldown = 0;

  function onPointer(e) {
    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    pointer.x = p.clientX; pointer.y = p.clientY;
    pointer.moved = true;
  }
  addEventListener('pointermove', onPointer, { passive:true });
  addEventListener('touchmove', onPointer, { passive:true });

  addEventListener('pointerdown', (e)=> {
    spawnBurst(e.clientX, e.clientY, 56);
  }, { passive:true });

  function frame(now) {
    const dt = clamp((now - last)/1000, 0.001, 0.033);
    last = now;

    ctx.clearRect(0,0,W,H);

    // bokeh
    for (const b of bokeh) {
      b.x += b.vx * dt*60;
      b.y += b.vy * dt*60;
      if (b.x < -200) b.x = W+200;
      if (b.x > W+200) b.x = -200;
      if (b.y < -200) b.y = H+200;
      if (b.y > H+200) b.y = -200;

      ctx.save();
      ctx.globalAlpha = b.a;
      ctx.fillStyle = `hsla(${b.hue}, 90%, 60%, 1)`;
      ctx.shadowBlur = 40;
      ctx.shadowColor = `hsla(${b.hue}, 90%, 60%, 0.35)`;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // pointer trail
    trailCooldown -= dt;
    if (pointer.moved && trailCooldown <= 0) {
      spawnTrail(pointer.x, pointer.y);
      trailCooldown = 0.012;
      pointer.moved = false;
    }

    // floating hearts
    if (Math.random() < 0.14) spawnFloatHeart();

    for (let i=floatHearts.length-1; i>=0; i--) {
      const fh = floatHearts[i];
      fh.x += fh.vx * dt*60;
      fh.y += fh.vy * dt*60;
      fh.rot += fh.vr * dt*60;

      ctx.save();
      ctx.globalAlpha = fh.a;
      ctx.translate(fh.x, fh.y);
      ctx.rotate(fh.rot);
      const s = fh.size;
      ctx.scale(s, s);
      ctx.shadowBlur = 22;
      ctx.shadowColor = `hsla(${fh.hue}, 95%, 60%, ${0.35})`;
      ctx.fillStyle = `hsla(${fh.hue}, 95%, 62%, 0.55)`;
      drawHeartPath(ctx);
      ctx.fill();
      ctx.restore();

      if (fh.y < -120) floatHearts.splice(i,1);
    }

    // update particles
    for (let i=particles.length-1; i>=0; i--) {
      const p = particles[i];
      if (!p.step(dt)) { particles.splice(i,1); continue; }
    }

    // draw particles
    for (const p of particles) p.draw(ctx);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
